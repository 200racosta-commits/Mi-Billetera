<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Elite - Tracker Personal</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --income: #b2d8d8; /* Verde Pastel */
      --expense: #ffb3ba; /* Rosa Pastel */
      --house: #bae1ff; /* Azul Pastel */
      --text: #4a4a4a;
      --accent: #d9adf6; /* Lavanda */
    }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    
    /* Header & Stats */
    .dashboard-header { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
    .stat-val { font-size: 22px; font-weight: bold; margin-top: 5px; }
    
    /* Charts Area */
    .charts-container { display: flex; gap: 20px; margin-bottom: 25px; background: var(--card); padding: 20px; border-radius: 15px; justify-content: space-around; flex-wrap: wrap; }
    .chart-item { text-align: center; min-width: 150px; }
    .percent-circle { font-size: 24px; font-weight: 800; color: var(--accent); }

    /* Controls */
    .toolbar { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
    .btn-upload { background: var(--accent); color: white; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; border: none; box-shadow: 0 4px 15px rgba(217, 173, 246, 0.4); }

    /* Three Column Layout */
    .main-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .column { background: var(--card); border-radius: 20px; overflow: hidden; height: 550px; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
    .col-header { padding: 15px; font-weight: bold; text-align: center; color: white; text-transform: uppercase; letter-spacing: 1px; }
    .scroll-area { overflow-y: auto; flex-grow: 1; padding: 10px; }
    
    .item-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f0f0f0; align-items: center; }
    .item-info { display: flex; flex-direction: column; font-size: 13px; }
    .item-date { font-size: 10px; color: #999; }
    .item-amt { font-weight: bold; }

    @media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="container">
  <h1 style="text-align:center; color: var(--accent); margin-bottom: 20px;">Mi Dashboard Financiero</h1>

  <!-- Estadísticas Principales -->
  <div class="dashboard-header">
    <div class="stat-card" style="border-bottom: 4px solid var(--income)">
      <div style="font-size: 11px; color: #999">TOTAL ENTRADAS</div>
      <div id="ti" class="stat-val">$0.00</div>
    </div>
    <div class="stat-card" style="border-bottom: 4px solid var(--expense)">
      <div style="font-size: 11px; color: #999">GASTOS TOTALES</div>
      <div id="te" class="stat-val">$0.00</div>
    </div>
    <div class="stat-card" style="border-bottom: 4px solid var(--house)">
      <div style="font-size: 11px; color: #999">HOGAR & FIJOS</div>
      <div id="th" class="stat-val">$0.00</div>
    </div>
  </div>

  <!-- Panel de Porcentajes -->
  <div class="charts-container">
    <div class="chart-item">
      <div id="p-inc" class="percent-circle">0%</div>
      <div style="font-size: 10px; color: #999">Ratio Ahorro/Ingreso</div>
    </div>
    <div class="chart-item">
      <div id="p-house" class="percent-circle" style="color: var(--house)">0%</div>
      <div style="font-size: 10px; color: #999">% Gasto en Hogar</div>
    </div>
    <div class="chart-item">
      <div id="p-exp" class="percent-circle" style="color: var(--expense)">0%</div>
      <div style="font-size: 10px; color: #999">% Gastos Varios</div>
    </div>
  </div>

  <div class="toolbar">
    <label class="btn-upload">
      📥 SUBIR CSV
      <input type="file" id="fIn" accept=".csv" style="display:none">
    </label>
    <button onclick="localStorage.clear(); location.reload();" style="background:none; border:1px solid #ccc; color:#999; padding: 5px 15px; border-radius: 20px; cursor:pointer; font-size:11px;">Reset Mes</button>
  </div>

  <div class="main-grid">
    <!-- COLUMNA 1: INGRESOS -->
    <div class="column">
      <div class="col-header" style="background: var(--income)">💰 Ingresos</div>
      <div class="scroll-area" id="box-in"></div>
    </div>

    <!-- COLUMNA 2: HOGAR / FIJOS -->
    <div class="column">
      <div class="col-header" style="background: var(--house)">🏠 Hogar & Servicios</div>
      <div class="scroll-area" id="box-house"></div>
    </div>

    <!-- COLUMNA 3: GASTOS VARIOS -->
    <div class="column">
      <div class="col-header" style="background: var(--expense)">🛍️ Otros Gastos</div>
      <div class="scroll-area" id="box-out"></div>
    </div>
  </div>
</div>

<script>
  let db = JSON.parse(localStorage.getItem('wallet_v20')) || [];

  document.getElementById('fIn').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(evt) {
      const lines = evt.target.result.split(/\r?\n/);
      const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
      
      const iD = headers.findIndex(h => /date|fecha/i.test(h));
      const iS = headers.findIndex(h => /description|desc|memo|name/i.test(h));
      const iA = headers.findIndex(h => /amount|monto|total/i.test(h));

      for (let i = 1; i < lines.length; i++) {
        const c = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (c.length > 1) {
          let a = parseFloat(c[iA]?.replace(/[$\s"]/g, '').replace(/,/g, ''));
          if (!isNaN(a)) {
            let d = c[iS]?.replace(/"/g, '') || 'Detalle';
            let cat = "VARIO";
            const lowD = d.toLowerCase();
            
            // Reglas de Clasificación para la columna Hogar
            if(lowD.includes('rent') || lowD.includes('peco') || lowD.includes('utility') || 
               lowD.includes('insurance') || lowD.includes('pseg') || lowD.includes('auto') || 
               lowD.includes('mortgage')) {
              cat = "HOGAR";
            } else if (a >= 0) {
              cat = "INGRESO";
            }
            
            db.push({ date: c[iD]?.replace(/"/g, '') || 'S/F', desc: d, amount: a, type: cat });
          }
        }
      }
      ui();
    };
    reader.readAsText(file);
  });

  function ui() {
    const bIn = document.getElementById('box-in');
    const bHouse = document.getElementById('box-house');
    const bOut = document.getElementById('box-out');
    bIn.innerHTML = ''; bHouse.innerHTML = ''; bOut.innerHTML = '';
    
    let ti = 0, te = 0, th = 0;

    db.sort((a,b) => new Date(b.date) - new Date(a.date));

    db.forEach(t => {
      const row = `<div class="item-row">
        <div class="item-info">
          <span class="item-date">${t.date}</span>
          <span style="font-weight:600">${t.desc.substring(0,22)}</span>
        </div>
        <span class="item-amt" style="color:${t.amount >= 0 ? '#4caf50' : '#f44336'}">$${Math.abs(t.amount).toFixed(2)}</span>
      </div>`;

      if (t.type === "INGRESO") { bIn.innerHTML += row; ti += t.amount; }
      else if (t.type === "HOGAR") { bHouse.innerHTML += row; th += Math.abs(t.amount); }
      else { bOut.innerHTML += row; te += Math.abs(t.amount); }
    });

    // Totales
    document.getElementById('ti').innerText = `$${ti.toFixed(2)}`;
    document.getElementById('th').innerText = `$${th.toFixed(2)}`;
    document.getElementById('te').innerText = `$${te.toFixed(2)}`;

    // Estadísticas en Porcentaje
    if(ti > 0) {
      const gTot = th + te;
      document.getElementById('p-inc').innerText = Math.round(((ti - gTot) / ti) * 100) + "%";
      document.getElementById('p-house').innerText = Math.round((th / ti) * 100) + "%";
      document.getElementById('p-exp').innerText = Math.round((te / ti) * 100) + "%";
    }

    localStorage.setItem('wallet_v20', JSON.stringify(db));
  }
  ui();
</script>
</body>
</html>
