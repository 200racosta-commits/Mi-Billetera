<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Guardian PRO v5.0</title>
  <!-- Cargamos la librería de gráficos -->
  <script src="https://jsdelivr.net"></script>
  <style>
    :root { 
      --bg: #fdfbfb; --card: #ffffff; 
      --income: #c1e1c1; --house: #bcd4e6; --subs: #fbc4ab; --expense: #ffb3ba; 
      --text: #555; --accent: #b19cd9; --alert: #ff6b6b;
    }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    .container { max-width: 1500px; margin: 0 auto; }
    
    .alert-panel { background: #fff5f5; border: 1px solid var(--alert); color: var(--alert); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; font-weight: bold; text-align: center; }

    /* Layout para el Gráfico */
    .dashboard-top { display: grid; grid-template-columns: 1fr 300px; gap: 20px; margin-bottom: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .stat-card { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); text-align: center; border-bottom: 4px solid #ddd; }
    .stat-val { font-size: 20px; font-weight: bold; }
    .chart-box { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: center; }

    /* Buscador */
    .search-bar { width: 100%; padding: 12px; border-radius: 25px; border: 1px solid #eee; margin-bottom: 20px; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }

    .main-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .column { background: var(--card); border-radius: 15px; overflow: hidden; height: 500px; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .col-header { padding: 12px; font-weight: bold; text-align: center; color: white; text-transform: uppercase; font-size: 11px; }
    .scroll-area { overflow-y: auto; flex-grow: 1; padding: 5px; }
    
    .item-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #fafafa; font-size: 12px; }
    .item-date { font-size: 9px; color: #aaa; display: block; margin-bottom: 2px; }
    .over-limit { border: 2px solid var(--alert) !important; background: #fff5f5; }

    @media (max-width: 1100px) { .main-grid { grid-template-columns: 1fr 1fr; } .dashboard-top { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="container">
  <h2 style="text-align:center; color: var(--accent); font-weight: 800;">Billetera Guardian Intelligence</h2>

  <div id="main-alert" class="alert-panel">⚠️ ¡ALERTA! Has superado tus límites establecidos.</div>

  <!-- Dashboard con Gráfico -->
  <div class="dashboard-top">
    <div class="stats-grid">
      <div class="stat-card" style="border-color: var(--income)"><div>Ingresos</div><div id="ti" class="stat-val">$0.00</div></div>
      <div class="stat-card" style="border-color: var(--house)"><div>Hogar</div><div id="th" class="stat-val">$0.00</div></div>
      <div class="stat-card" style="border-color: var(--subs)"><div>Suscripciones</div><div id="ts" class="stat-val">$0.00</div></div>
      <div class="stat-card" style="border-color: var(--expense)"><div>Otros</div><div id="te" class="stat-val">$0.00</div></div>
    </div>
    <div class="chart-box">
      <canvas id="myChart" width="200" height="200"></canvas>
    </div>
  </div>

  <!-- Buscador Universal -->
  <input type="text" id="universalSearch" class="search-bar" placeholder="🔍 Buscar gasto o monto específico..." onkeyup="filterItems()">

  <div style="text-align:center; margin-bottom: 20px;">
    <label style="background:var(--accent); color:white; padding: 10px 25px; border-radius: 20px; font-weight:bold; cursor:pointer">
      📥 CARGAR CSV <input type="file" id="fIn" accept=".csv" style="display:none">
    </label>
  </div>

  <div class="main-grid">
    <div class="column" id="col-in"><div class="col-header" style="background:var(--income)">💰 Ingresos</div><div class="scroll-area" id="box-in"></div></div>
    <div class="column" id="col-house"><div class="col-header" style="background:var(--house)">🏠 Hogar</div><div class="scroll-area" id="box-house"></div></div>
    <div class="column" id="col-subs"><div class="col-header" style="background:var(--subs)">📺 Suscripciones</div><div class="scroll-area" id="box-subs"></div></div>
    <div class="column" id="col-out"><div class="col-header" style="background:var(--expense)">🛍️ Otros</div><div class="scroll-area" id="box-out"></div></div>
  </div>
</div>

<script>
  let db = JSON.parse(localStorage.getItem('wallet_v50')) || [];
  let myChart = null;

  function filterItems() {
    const query = document.getElementById('universalSearch').value.toLowerCase();
    const rows = document.querySelectorAll('.item-row');
    rows.forEach(row => {
      const text = row.innerText.toLowerCase();
      row.style.display = text.includes(query) ? 'flex' : 'none';
    });
  }

  document.getElementById('fIn').addEventListener('change', function(e) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      const lines = evt.target.result.split(/\r?\n/);
      const h = lines.split(',').map(x => x.trim().replace(/"/g, ''));
      const iD = h.findIndex(k => /date|fecha/i.test(k));
      const iS = h.findIndex(k => /desc|name|memo/i.test(k));
      const iA = h.findIndex(k => /amount|monto|total/i.test(k));

      for (let i = 1; i < lines.length; i++) {
        const c = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (c.length > 1) {
          let a = parseFloat(c[iA]?.replace(/[$\s"]/g, '').replace(/,/g, ''));
          if (!isNaN(a)) {
            let d = c[iS]?.replace(/"/g, '') || 'Detalle';
            let type = a >= 0 ? "INGRESO" : "VARIO";
            const lowD = d.toLowerCase();
            const subKeywords = ['netflix', 'spotify', 'disney', 'apple', 'icloud', 'amazon prime', 'gym', 'canva', 'hbo', 'Klarna', 'AFFIRM', 'AFTERPAY', 'SC'];
            if(subKeywords.some(kw => lowD.includes(kw))) type = "SUBS";
            else if (lowD.includes('rent') || lowD.includes('peco') || lowD.includes('insurance')) type = "HOGAR";
            db.push({ date: c[iD]?.replace(/"/g, '') || 'S/F', desc: d, amount: a, type: type });
          }
        }
      }
      ui();
    };
    reader.readAsText(e.target.files);
  });

  function initChart(data) {
    const ctx = document.getElementById('myChart').getContext('2d');
    if (myChart) myChart.destroy();
    myChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Hogar', 'Suscrip.', 'Otros'],
        datasets: [{
          data: [data.HOGAR, data.SUBS, data.VARIO],
          backgroundColor: ['#bcd4e6', '#fbc4ab', '#ffb3ba'],
          borderWidth: 0
        }]
      },
      options: { cutout: '70%', plugins: { legend: { display: false } } }
    });
  }

  function ui() {
    const boxes = { INGRESO: document.getElementById('box-in'), HOGAR: document.getElementById('box-house'), SUBS: document.getElementById('box-subs'), VARIO: document.getElementById('box-out') };
    Object.values(boxes).forEach(b => b.innerHTML = '');
    let totals = { INGRESO: 0, HOGAR: 0, SUBS: 0, VARIO: 0 };

    db.forEach((t, idx) => {
      const row = `<div class="item-row">
        <div><span class="item-date">${t.date}</span><b>${t.desc.substring(0,18)}</b></div>
        <div style="font-weight:bold">$${Math.abs(t.amount).toFixed(2)}</div>
      </div>`;
      if(boxes[t.type]) {
        boxes[t.type].innerHTML += row;
        totals[t.type] += Math.abs(t.amount);
      }
    });

    document.getElementById('ti').innerText = `$${totals.INGRESO.toFixed(2)}`;
    document.getElementById('th').innerText = `$${totals.HOGAR.toFixed(2)}`;
    document.getElementById('ts').innerText = `$${totals.SUBS.toFixed(2)}`;
    document.getElementById('te').innerText = `$${totals.VARIO.toFixed(2)}`;

    initChart(totals);
    localStorage.setItem('wallet_v50', JSON.stringify(db));
  }
  ui();
</script>
</body>
</html>
