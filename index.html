<!-- Reemplaza tu actual limit-bar por esta que incluye el BUSCADOR -->
<div class="limit-bar" style="flex-wrap: wrap;">
  <div>Límite Subs: $ <input type="number" id="limS" value="100" oninput="render()"></div>
  <div>Límite Hogar: $ <input type="number" id="limH" value="1500" oninput="render()"></div>
  <!-- NUEVO BUSCADOR -->
  <div style="margin-left: 20px; border-left: 1px solid #ddd; padding-left: 20px;">
    🔍 <input type="text" id="busq" placeholder="Buscar nombre o monto..." oninput="render()" style="width: 180px;">
  </div>
</div>

<script>
  let db = JSON.parse(localStorage.getItem('wallet_universal_v1')) || [];

  function addManual() {
    const d = document.getElementById('m-desc').value, 
          a = parseFloat(document.getElementById('m-amt').value), 
          t = document.getElementById('m-type').value;
    if(d && !isNaN(a)) {
      db.push({ 
        date: new Date().toLocaleDateString(), 
        desc: d, 
        amount: t === "INGRESO" ? Math.abs(a) : -Math.abs(a), 
        type: t 
      });
      localStorage.setItem('wallet_universal_v1', JSON.stringify(db));
      render();
      document.getElementById('m-desc').value = ''; 
      document.getElementById('m-amt').value = '';
    }
  }

  // ... (Tu detector de CSV se mantiene igual, asegúrate de que llame a render() al final)

  function render() {
    const boxes = { 
      INGRESO: document.getElementById('box-in'), 
      HOGAR: document.getElementById('box-h'), 
      SUBS: document.getElementById('box-s'), 
      VARIO: document.getElementById('box-o') 
    };
    
    // Limpiar cajas
    Object.values(boxes).forEach(b => b.innerHTML = "");
    
    let totals = { INGRESO: 0, HOGAR: 0, SUBS: 0, VARIO: 0 };
    const busq = document.getElementById('busq').value.toLowerCase();

    // Filtrar y Procesar
    db.forEach((item, index) => {
      const desc = item.desc.toLowerCase();
      const monto = Math.abs(item.amount).toString();
      
      // Lógica del Buscador
      if (desc.includes(busq) || monto.includes(busq)) {
        totals[item.type] += Math.abs(item.amount);
        
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div style="flex:1">
            <div style="font-weight:bold">${item.desc}</div>
            <div style="color:#999; font-size:10px">${item.date}</div>
          </div>
          <div style="margin-right:10px">$${Math.abs(item.amount).toFixed(2)}</div>
          <button class="btn-del" onclick="eliminar(${index})">×</button>
        `;
        boxes[item.type].appendChild(row);
      }
    });

    // Actualizar Totales en pantalla
    document.getElementById('ti').innerText = `$${totals.INGRESO.toFixed(2)}`;
    document.getElementById('th').innerText = `$${totals.HOGAR.toFixed(2)}`;
    document.getElementById('ts').innerText = `$${totals.SUBS.toFixed(2)}`;
    document.getElementById('te').innerText = `$${totals.VARIO.toFixed(2)}`;

    // LÓGICA DE ALERTAS DE LÍMITES
    const limH = parseFloat(document.getElementById('limH').value) || 0;
    const limS = parseFloat(document.getElementById('limS').value) || 0;

    // Alerta Hogar
    const cardH = document.getElementById('card-h');
    const colH = document.getElementById('col-house');
    if(totals.HOGAR > limH) {
      cardH.classList.add('over-limit');
      colH.classList.add('over-limit');
    } else {
      cardH.classList.remove('over-limit');
      colH.classList.remove('over-limit');
    }

    // Alerta Subs
    const cardS = document.getElementById('card-s');
    const colS = document.getElementById('col-subs');
    if(totals.SUBS > limS) {
      cardS.classList.add('over-limit');
      colS.classList.add('over-limit');
    } else {
      cardS.classList.remove('over-limit');
      colS.classList.remove('over-limit');
    }

    localStorage.setItem('wallet_universal_v1', JSON.stringify(db));
  }

  function eliminar(index) {
    db.splice(index, 1);
    render();
  }

  // Carga inicial
  render();
</script>
